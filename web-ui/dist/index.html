<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polymarket Trend Analyzer</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 360px;
            background: #111827;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .market-form {
            display: flex;
            gap: 10px;
        }

        .market-form input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #1f2937;
            color: white;
            outline: none;
        }

        .market-form input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .market-form button {
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 12px;
            padding: 0 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .market-form button:hover {
            background: #1d4ed8;
        }

        .market-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .market-card {
            display: flex;
            gap: 14px;
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
        }

        .market-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .market-card.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.12);
        }

        .market-card img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .market-info {
            min-width: 0;
        }

        .market-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 6px;
        }

        .market-slug {
            font-size: 12px;
            color: #94a3b8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
        }

        .topbar-left h1 {
            margin: 0;
            font-size: 24px;
        }

        .topbar-left p {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 14px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 12px;
        }

        .control-group label {
            font-size: 13px;
            color: #cbd5e1;
        }

        .control-group select {
            background: transparent;
            border: none;
            color: white;
            outline: none;
        }

        /* METRICS */

        .metrics {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 16px 24px 0;
        }

        .metric-chip {
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
        }

        .metric-chip input {
            accent-color: #3b82f6;
        }

        /* SUMMARY */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            padding: 16px 24px 0;
        }

        .summary-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 18px;
        }

        .summary-label {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 26px;
            font-weight: 700;
        }

        .summary-sub {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 13px;
        }

        /* CHART */

        .chart-wrapper {
            flex: 1;
            padding: 24px;
            min-height: 0;
        }

        .chart-card {
            height: 100%;
            background: #111827;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px;
            position: relative;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-header">

                <div class="logo">
                    Polymarket Trends
                </div>

                <div class="market-form">
                    <input id="marketUrlInput" type="text" placeholder="Paste Polymarket URL..." />

                    <button id="addMarketBtn">
                        Add
                    </button>
                </div>

            </div>

            <div class="market-list" id="marketList"></div>

        </aside>

        <!-- MAIN -->
        <main class="main">

            <div class="topbar">

                <div class="topbar-left">
                    <h1 id="selectedTitle">
                        Select a market
                    </h1>

                    <p id="selectedSlug">
                        No market selected
                    </p>
                </div>

                <div class="controls">

                    <div class="control-group">
                        <label>Lookback</label>

                        <select id="daysSelect">
                            <option value="1">1 day</option>
                            <option value="3">3 days</option>
                            <option value="7" selected>7 days</option>
                            <option value="14">14 days</option>
                            <option value="30">30 days</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label>Outcome</label>

                        <select id="outcomeSelect">
                            <option value="all">All</option>
                        </select>
                    </div>

                </div>

            </div>

            <div class="summary-grid" id="summaryGrid"></div>

            <div class="metrics" id="metricsContainer"></div>

            <div class="chart-wrapper">

                <div class="chart-card">

                    <canvas id="analysisChart"></canvas>

                    <div class="empty-state" id="emptyState">
                        Select a market from the sidebar
                    </div>

                </div>

            </div>

        </main>

    </div>

    <script>

        const API_BASE = "";

        const metricOptions = [
            "Price",
            "PredictionRate",
            "ProfitRate",
            "WeightedProfitRate",
            "TotalProfit"
        ];

        const outcomeColors = {
            Yes: "#3b82f6",
            No: "#ef4444",
            Maybe: "#10b981"
        };

        const fallbackColors = [
            "#f59e0b",
            "#8b5cf6",
            "#06b6d4",
            "#ec4899"
        ];

        const metricStyles = {
            Price: {
                borderDash: [],
                width: 4,
                opacity: 1
            },

            PredictionRate: {
                borderDash: [10, 5],
                width: 3,
                opacity: 0.95
            },

            ProfitRate: {
                borderDash: [3, 3],
                width: 2,
                opacity: 0.9
            },

            WeightedProfitRate: {
                borderDash: [15, 5, 3, 5],
                width: 2,
                opacity: 0.8
            },

            TotalProfit: {
                borderDash: [],
                width: 3,
                opacity: 0.75,
                yAxisID: "profitAxis"
            }
        };

        let selectedMetricsState = {
            Price: true,
            PredictionRate: true,
            ProfitRate: false,
            WeightedProfitRate: false,
            TotalProfit: false
        };

        let trackedMarkets = [];
        let selectedMarket = null;
        let chart = null;
        let analysisData = [];

        const marketListEl = document.getElementById("marketList");
        const selectedTitleEl = document.getElementById("selectedTitle");
        const selectedSlugEl = document.getElementById("selectedSlug");
        const daysSelectEl = document.getElementById("daysSelect");
        const outcomeSelectEl = document.getElementById("outcomeSelect");
        const metricsContainerEl = document.getElementById("metricsContainer");
        const summaryGridEl = document.getElementById("summaryGrid");
        const emptyStateEl = document.getElementById("emptyState");

        async function fetchTrackedMarkets() {

            try {

                const response = await fetch(`${API_BASE}/tracked`);

                trackedMarkets = await response.json();

                renderMarketList();

            } catch (err) {

                console.error(err);

            }
        }

        function renderMarketList() {

            marketListEl.innerHTML = "";

            trackedMarkets.forEach(market => {

                const card = document.createElement("div");

                card.className = "market-card";

                if (
                    selectedMarket &&
                    selectedMarket.MarketId === market.MarketId
                ) {
                    card.classList.add("active");
                }

                card.innerHTML = `
        <img src="${market.Image}" />

        <div class="market-info">
          <div class="market-title">
            ${market.Question}
          </div>

          <div class="market-slug">
            ${market.Slug}
          </div>
        </div>
      `;

                card.addEventListener("click", () => {
                    selectMarket(market);
                });

                marketListEl.appendChild(card);

            });
        }

        async function selectMarket(market) {

            selectedMarket = market;

            renderMarketList();

            selectedTitleEl.textContent = market.Question;
            selectedSlugEl.textContent = market.Slug;

            await loadAnalysis();
        }

        async function loadAnalysis() {

            if (!selectedMarket) return;

            try {

                document.body.classList.add("loading");

                const response = await fetch(
                    `${API_BASE}/get-market-analysis?marketId=${selectedMarket.MarketId}&days=${daysSelectEl.value}`
                );

                if (response.status === 204) {

                    analysisData = [];

                    showEmptyState(
                        "⏳",
                        "Loading market analysis",
                        "This market is being processed.<br>Please come back later."
                    );

                    return;
                }

                analysisData = await response.json();

                if (!analysisData || analysisData.length === 0) {

                    showEmptyState(
                        "📭",
                        "No analysis data",
                        "No analysis has been generated yet."
                    );

                    return;
                }

                emptyStateEl.style.display = "none";

                populateOutcomeSelect();

                renderMetricControls();

                renderSummaryCards();

                renderChart();

            } catch (err) {

                console.error(err);

                showEmptyState(
                    "⚠️",
                    "Failed to load data",
                    "Please try again later."
                );

            } finally {

                document.body.classList.remove("loading");

            }
        }

        function showEmptyState(icon, title, subtitle) {

            if (chart) {
                chart.destroy();
                chart = null;
            }

            metricsContainerEl.innerHTML = "";
            summaryGridEl.innerHTML = "";

            emptyStateEl.style.display = "flex";

            emptyStateEl.innerHTML = `
      <div>
        <div style="font-size:30px;margin-bottom:12px;">
          ${icon}
        </div>

        <div style="font-size:18px;font-weight:700;margin-bottom:8px;">
          ${title}
        </div>

        <div style="color:#94a3b8;">
          ${subtitle}
        </div>
      </div>
    `;
        }

        function populateOutcomeSelect() {

            const previous = outcomeSelectEl.value || "all";

            outcomeSelectEl.innerHTML = `
      <option value="all">All</option>
    `;

            const outcomes = new Set();

            analysisData.forEach(entry => {
                entry.Outcomes.forEach(outcome => {
                    outcomes.add(outcome.Outcome);
                });
            });

            outcomes.forEach(outcome => {

                const option = document.createElement("option");

                option.value = outcome;
                option.textContent = outcome;

                outcomeSelectEl.appendChild(option);

            });

            if (
                [...outcomeSelectEl.options]
                    .some(o => o.value === previous)
            ) {
                outcomeSelectEl.value = previous;
            }
        }

        function renderMetricControls() {

            metricsContainerEl.innerHTML = "";

            metricOptions.forEach(metric => {

                const chip = document.createElement("label");

                chip.className = "metric-chip";

                chip.innerHTML = `
        <input
          type="checkbox"
          value="${metric}"
          ${selectedMetricsState[metric] ? "checked" : ""}
        />

        <span>${metric}</span>
      `;

                const checkbox = chip.querySelector("input");

                checkbox.addEventListener("change", () => {

                    selectedMetricsState[metric] = checkbox.checked;

                    renderChart();

                });

                metricsContainerEl.appendChild(chip);

            });
        }

        function getSelectedMetrics() {

            return Object.entries(selectedMetricsState)
                .filter(([_, enabled]) => enabled)
                .map(([metric]) => metric);
        }

        function getOutcomeColor(name, index) {

            if (outcomeColors[name]) {
                return outcomeColors[name];
            }

            return fallbackColors[index % fallbackColors.length];
        }

        function renderSummaryCards() {

            summaryGridEl.innerHTML = "";

            const latest = analysisData[analysisData.length - 1];

            if (!latest) return;

            latest.Outcomes.forEach((outcome, index) => {

                const card = document.createElement("div");

                card.className = "summary-card";

                const color = getOutcomeColor(outcome.Outcome, index);

                card.innerHTML = `
        <div class="summary-label">
          ${outcome.Outcome}
        </div>

        <div
          class="summary-value"
          style="color:${color};"
        >
          ${(outcome.Price * 100).toFixed(1)}%
        </div>

        <div class="summary-sub">
          Prediction ${(outcome.PredictionRate * 100).toFixed(1)}%
        </div>

        <div class="summary-sub">
          Profit ${(outcome.ProfitRate * 100).toFixed(2)}%
        </div>
      `;

                summaryGridEl.appendChild(card);

            });
        }

        function renderChart() {

            if (!analysisData.length) return;

            emptyStateEl.style.display = "none";

            const selectedMetrics = getSelectedMetrics();

            const selectedOutcome = outcomeSelectEl.value;

            const datasets = [];

            const uniqueOutcomes = [];

            analysisData.forEach(entry => {

                entry.Outcomes.forEach(outcome => {

                    if (!uniqueOutcomes.includes(outcome.Outcome)) {
                        uniqueOutcomes.push(outcome.Outcome);
                    }

                });

            });

            selectedMetrics.forEach(metric => {

                const style = metricStyles[metric];

                uniqueOutcomes.forEach((outcomeName, index) => {

                    if (
                        selectedOutcome !== "all" &&
                        selectedOutcome !== outcomeName
                    ) {
                        return;
                    }

                    const values = [];

                    analysisData.forEach(entry => {

                        const outcome = entry.Outcomes.find(
                            o => o.Outcome === outcomeName
                        );

                        if (!outcome) return;

                        values.push({
                            x: entry.LookupTime,
                            y: outcome[metric]
                        });

                    });

                    datasets.push({

                        label: `${outcomeName} - ${metric}`,

                        data: values,

                        borderColor: getOutcomeColor(outcomeName, index),

                        backgroundColor: getOutcomeColor(outcomeName, index),

                        borderDash: style.borderDash,

                        borderWidth: style.width,

                        tension: 0.3,

                        pointRadius: 1.5,

                        fill: false,

                        yAxisID: style.yAxisID || "mainAxis"

                    });

                });

            });

            if (chart) {
                chart.destroy();
            }

            const ctx = document
                .getElementById("analysisChart")
                .getContext("2d");

            chart = new Chart(ctx, {

                type: "line",

                data: {
                    datasets
                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    interaction: {
                        mode: "nearest",
                        intersect: false
                    },

                    plugins: {

                        legend: {
                            labels: {
                                color: "#e2e8f0"
                            }
                        },

                        tooltip: {
                            backgroundColor: "#111827",
                            borderColor: "rgba(255,255,255,0.1)",
                            borderWidth: 1
                        }
                    },

                    scales: {

                        x: {

                            type: "time",

                            time: {
                                tooltipFormat: "DDD T"
                            },

                            ticks: {
                                color: "#94a3b8"
                            },

                            grid: {
                                color: "rgba(255,255,255,0.05)"
                            }
                        },

                        mainAxis: {

                            type: "linear",

                            position: "left",

                            ticks: {
                                color: "#94a3b8"
                            },

                            grid: {
                                color: "rgba(255,255,255,0.05)"
                            }
                        },

                        profitAxis: {

                            type: "linear",

                            position: "right",

                            ticks: {
                                color: "#c084fc"
                            },

                            grid: {
                                drawOnChartArea: false
                            }
                        }
                    }
                }
            });
        }

        async function addMarket() {

            const input = document.getElementById("marketUrlInput");

            const url = input.value.trim();

            if (!url) return;

            try {

                const response = await fetch(
                    `${API_BASE}/tracked?url=${encodeURIComponent(url)}`,
                    {
                        method: "POST"
                    }
                );

                if (!response.ok) {
                    throw new Error("Failed");
                }

                input.value = "";

                await fetchTrackedMarkets();

            } catch (err) {

                console.error(err);

                alert("Failed to add market");

            }
        }

        document
            .getElementById("addMarketBtn")
            .addEventListener("click", addMarket);

        document
            .getElementById("marketUrlInput")
            .addEventListener("keydown", e => {

                if (e.key === "Enter") {
                    addMarket();
                }

            });

        daysSelectEl.addEventListener("change", loadAnalysis);

        outcomeSelectEl.addEventListener("change", renderChart);

        fetchTrackedMarkets();

    </script>

</body>

</html>
